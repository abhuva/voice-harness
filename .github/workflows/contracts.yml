name: Harness contracts

on:
  push:
    branches: [main]
    paths: [".github/workflows/contracts.yml", "src/**", "tests/**", "pyproject.toml", "uv.lock"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/contracts.yml", "src/**", "tests/**", "pyproject.toml", "uv.lock"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.6.14"
          python-version: "3.13"
      - name: Verify the locked environment
        run: uv sync --locked
      - name: Verify claims, resources and delayed results
        run: uv run --locked python -m unittest discover -s tests -p test_harness_contract.py -v
      - name: Verify the call workflow
        run: uv run --locked python -m unittest discover -s tests -p test_call.py -v
