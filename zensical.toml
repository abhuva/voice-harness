[project]
site_name = "Voice Harness"
site_description = "Windows setup, voice calls, local speech tools, and architecture decisions."
site_url = "https://abhuva.github.io/voice-harness/"
repo_url = "https://github.com/abhuva/voice-harness"
repo_name = "abhuva/voice-harness"
docs_dir = "docs"
site_dir = "site"
dev_addr = "127.0.0.1:8767"
nav = [
    { "Overview" = "README.md" },
    { "Setup and operation" = "operations.md" },
    { "Harness" = [
        "harness/README.md",
        { "Architecture diagrams" = "harness/diagrams.md" },
        { "Stack proposal" = "harness/stack.md" },
        { "Implementation review" = "harness/review.md" },
    ] },
    { "Voice runtime" = "architecture.md" },
    { "Decision records" = [
        "adr/README.md",
        { "001 · Single-host runtime" = "adr/001-single-host-call.md" },
        { "002 · Local voice presets" = "adr/002-local-voice-presets.md" },
        { "003 · Voice interruption" = "adr/003-barge-in.md" },
        { "004 · Scoped work" = "adr/004-scoped-work.md" },
        { "005 · Warm speech models" = "adr/005-warm-speech-models.md" },
        { "006 · Local conversation scoring" = "adr/006-local-conversation-scoring.md" },
        { "007 · On-demand recognition" = "adr/007-on-demand-recognition.md" },
        { "008 · Fluid Speech Pro on Vulkan" = "adr/008-fluid-vulkan.md" },
        { "009 · Pocket TTS on CUDA" = "adr/009-pocket-tts-cuda.md" },
        { "010 · Scoped speech settings" = "adr/010-scoped-speech-settings.md" },
        { "011 · Jevos on Vulkan" = "adr/011-jevos-vulkan.md" },
        { "012 · Phone audio" = "adr/012-phone-audio.md" },
        { "013 · Tailnet routing" = "adr/013-tailnet-routing.md" },
    ] },
]

[project.markdown_extensions]
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.theme]
font = false
features = ["navigation.footer", "navigation.sections", "navigation.top", "content.code.copy", "search.highlight"]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
